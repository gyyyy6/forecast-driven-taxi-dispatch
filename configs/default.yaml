project:
  name: nyc-hvfhv-demand-dispatch
  seed: 42
  # 原始时间戳为纽约本地时间（naive），不做时区转换以避免 DST 歧义
  timezone: America/New_York

paths:
  raw_dir: data/raw
  raw_glob: "fhvhv_tripdata_*.parquet"
  zone_lookup: data/raw/taxi_zone_lookup.csv
  zone_shapefile: data/raw/taxi_zones/taxi_zones.shp
  zone_centroids: data/raw/taxi_zone_centroids.csv
  panel: data/processed/demand_panel.parquet
  sample_day: data/processed/sample_day.parquet
  sample_month: data/processed/sample_month.parquet
  features: data/processed/features.parquet
  feature_list: data/processed/feature_list.json
  # STGCN 多变量输入：[T, N, F]，DataLoader 组 batch 后为 [B, T, N, F]
  feature_tensor: data/processed/feature_tensor.npy
  # 邻接矩阵：build_graph.py 输出，263×263，默认行归一化 + 自环
  adjacency: data/processed/adj_matrix.npy
  model_dir: data/processed/models
  prediction_dir: data/processed/predictions
  simulation_dir: data/processed/simulation
  log_dir: data/processed/logs

data:
  start: "2023-01-01"
  end: "2023-02-01"
  freq: "15min"
  zone_min: 1
  zone_max: 263

graph:
  # centroid：质心 kNN 高斯核；od：历史订单共现；hybrid：两者加权
  method: centroid
  k: 8
  sigma: null          # null = 取 kNN 距离中位数
  normalize: row       # row | sym | none
  add_self_loops: true
  od_log1p: true       # OD 计数先 log1p，抑制枢纽区域量级碾压
  hybrid_alpha: 0.5    # hybrid 中 OD 的权重

split:
  # 严格按时间顺序切分，禁止 shuffle / 随机划分
  train: 0.70
  val: 0.15
  test: 0.15

features:
  lags: [1, 2, 4, 8, 96, 672]
  rolling_windows: [4, 96]
  calendar: [hour, minute, dow, is_weekend, is_holiday]
  cyclic: true
  # 是否额外导出 STGCN 使用的 [T, N, F] 张量
  tensor: true
  # 只用训练期统计量做标准化，避免泄漏
  standardize: true

lgbm:
  objective: regression_l1
  metric: mae
  n_estimators: 2000
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  n_jobs: -1
  # cpu / gpu：gpu 需要 GPU 版 LightGBM；成员 C 建议先用 cpu
  device: cpu
  early_stopping_rounds: 100

stgnn:
  seq_len: 12          # 3 小时历史
  pred_len: 1          # 预测未来 15 分钟
  batch_size: 16       # 1660 Ti 6G 也安全；4060 可尝试 32
  hidden_channels: 32
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0       # Windows 下建议 0
  device: cuda
  grad_clip: 5.0
  # 若 feature_tensor.npy 存在则默认使用多变量输入；可用 --no-features 关闭
  use_features: true
  # 可选监控：--tensorboard / --plot 覆盖以下开关
  tensorboard: false
  plot: false

simulation:
  start: "2023-01-31 00:00"
  end: "2023-01-31 06:00"
  n_vehicles: 200
  speed_kmh: 25
  service_time_min: 12
  max_wait_min: 30
  dispatch_interval_min: 15
  seed: 42

visualization:
  prediction_path: data/processed/predictions/pred_test.parquet
  simulation_path: data/processed/simulation/sim_results.parquet